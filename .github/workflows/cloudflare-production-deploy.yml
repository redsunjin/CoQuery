name: cloudflare-production-deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Install Python Worker tooling
        run: uv sync

      - name: Prepare isolated Worker bundle
        run: python3 scripts/prepare_cloudflare_bundle.py

      - name: Deploy to Cloudflare account
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          uv run pywrangler deploy 2>&1 | tee /tmp/cloudflare-production-deploy.log
          WORKER_URL=$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/cloudflare-production-deploy.log | tail -n 1 || true)
          test -n "$WORKER_URL"
          echo "worker_url=${WORKER_URL}" >> "$GITHUB_OUTPUT"
          echo "## CoQuery production Cloudflare deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker URL: ${WORKER_URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production health endpoint
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          status=""
          for attempt in $(seq 1 12); do
            status=$(curl --show-error --silent --output /tmp/health.json --write-out '%{http_code}' "$WORKER_URL/api/health" || true)
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 2
          done
          test "$status" = "200"
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/health.json').read_text())
          assert payload.get('ok') is True, payload
          assert payload.get('service') == 'coquery-pwa-worker', payload
          PY

      - name: Verify PWA shell and manifest
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent "$WORKER_URL/" -o /tmp/index.html
          grep -q 'manifest.webmanifest' /tmp/index.html
          curl --fail --show-error --silent "$WORKER_URL/manifest.webmanifest" -o /tmp/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/manifest.json').read_text())
          assert payload.get('name'), payload
          assert payload.get('display') == 'standalone', payload
          PY

      - name: Verify hosted practice API
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail

          post_json_with_retry() {
            local label="$1"
            local payload="$2"
            local output="$3"
            local status=""

            for attempt in $(seq 1 12); do
              status=$(curl --show-error --silent \
                --output "$output" \
                --write-out '%{http_code}' \
                -H 'Content-Type: application/json' \
                -d "$payload" \
                "$WORKER_URL/api/commands/run" || true)
              echo "${label} attempt ${attempt}: HTTP ${status}"

              if [ "$status" = "200" ]; then
                return 0
              fi

              if [ -s "$output" ]; then
                cat "$output"
                echo
              fi

              case "$status" in
                000|404|5??)
                  sleep 2
                  ;;
                *)
                  echo "${label} failed with non-retryable HTTP ${status}" >&2
                  return 1
                  ;;
              esac
            done

            echo "${label} did not become ready after 12 attempts; last HTTP ${status}" >&2
            return 1
          }

          post_json_with_retry \
            "practice_list" \
            '{"command":"practice_list","args":{},"context":{"mode":"training"}}' \
            /tmp/practice-list.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/practice-list.json').read_text())
          assert payload.get('ok') is True, payload
          assert len(payload.get('data', {}).get('problems', [])) >= 24, payload
          PY

          post_json_with_retry \
            "practice_grade" \
            '{"command":"practice_grade","args":{"pack":"sql_basics","problem_id":"basic_select_customers","sql":"SELECT id, name, region FROM customers ORDER BY id"},"context":{"mode":"training"}}' \
            /tmp/practice-grade.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/practice-grade.json').read_text())
          assert payload.get('ok') is True, payload
          assert payload.get('data', {}).get('correct') is True, payload
          PY
